<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - Morrowvis</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Morrowvis">
    <meta property="og:title" content="Roadmap">
    <meta property="og:url" content="https://morrowvis.com/documentation/roadmap/">
    <meta property="og:image" content="https://morrowvis.com/images/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/svg+xml" href="../../images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body data-page="roadmap">
    <div id="navbarMount"></div>

    <section class="doc-content">
        <div class="container doc-layout">
            <div class="doc-main-wrap">
            <div class="doc-main">
                <h1>Roadmap</h1>
                <h2 id="roadmapProjectTitle"></h2>
                <div id="roadmapRoot"></div>
            </div>
            </div>
            <aside class="doc-sidebar" id="roadmapSidebar">
                <div id="roadmapProjectSwitcher"></div>
                <div id="roadmapSidebarMount"></div>
            </aside>
        </div>
    </section>

    <div id="footerMount"></div>
    <script>window.SITE_BASE = '../../';</script>
    <script src="../../nav.js"></script>
    <script src="../doc-sidebar.js"></script>
    <script src="roadmap-data.js"></script>
    <script>
        (function () {
            const root = document.getElementById('roadmapRoot');
            const sidebarTree = [];
            const params = new URLSearchParams(window.location.search);
            const requestedProject = params.get('project');
            const project = ROADMAP_PROJECTS.find(function (item) {
                return item.slug === requestedProject;
            }) || ROADMAP_PROJECTS[0];

            document.getElementById('roadmapProjectTitle').textContent = project.name;
            renderDocSidebarSwitcher(
                document.getElementById('roadmapProjectSwitcher'),
                'Project',
                ROADMAP_PROJECTS.map(function (item) {
                    return { value: item.slug, label: item.switcherName || item.name };
                }),
                project.slug,
                function (value) {
                    window.location.href = window.location.pathname + '?project=' + encodeURIComponent(value);
                }
            );

            project.groups.forEach(function (group) {
                const id = 'roadmap-' + project.slug + '-' + docSlugify(group.title);
                const wrap = document.createElement('div');
                wrap.className = 'roadmap-group';

                const h3 = document.createElement('h3');
                h3.textContent = group.title;
                addHeadingAnchor(h3, id);
                wrap.appendChild(h3);

                const ul = document.createElement('ul');
                ul.className = 'roadmap-list';
                group.items.forEach(function (html) {
                    const li = document.createElement('li');
                    li.innerHTML = html;
                    ul.appendChild(li);
                });
                wrap.appendChild(ul);

                root.appendChild(wrap);
                sidebarTree.push({ label: group.title, id: id });
            });

            root.querySelectorAll('a[href^="http://"], a[href^="https://"]').forEach(function (link) {
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
            });

            renderDocSidebar(document.getElementById('roadmapSidebarMount'), sidebarTree);
        })();
    </script>
</body>
</html>
